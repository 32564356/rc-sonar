<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC ソナー軽量版</title>
<style>
  body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
  #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
  video { width: 100%; height: 100%; object-fit: cover; }
  #target-box {
    position: absolute; width: 45%; height: 35%;
    border: 4px solid #00ff00; border-radius: 12px;
    box-sizing: border-box; pointer-events: none;
    transition: border-color 0.2s;
  }
  #ui { position: absolute; top: 30px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 12px; }
  button { font-size: 20px; padding: 12px 30px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; }
  #status { font-size: 22px; font-weight: bold; margin-top: 10px; color: #0f0; }
</style>
</head>
<body>

<div id="container">
  <video id="video" playsinline muted autoplay></video>
  <div id="target-box"></div>
  <div id="ui">
    <button id="startBtn">ソナー起動</button>
    <div id="status">待機中...</div>
  </div>
</div>
<canvas id="canvas" width="64" height="64" style="display:none;"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const targetBox = document.getElementById('target-box');
const statusText = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

let audioCtx;
let currentLevel = 0;
let baseColor = null;

function playBeep(duration = 0.08, freq = 1000) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}

// 音のループ
setInterval(() => {
  if (currentLevel === 3) playBeep(0.14, 1200);
  else if (currentLevel === 2) playBeep(0.08, 1000);
}, 200);

setInterval(() => {
  if (currentLevel === 1) playBeep(0.08, 900);
}, 600);

startBtn.addEventListener('click', async () => {
  try {
    startBtn.style.display = 'none';
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    video.srcObject = stream;
    statusText.innerText = 'センサー調整中...';

    // 1秒後に基準の景色を記憶
    setTimeout(() => {
      baseColor = getCenterColor();
      statusText.innerText = 'ソナー稼働中';
      loop();
    }, 1000);
  } catch (e) {
    statusText.innerText = 'カメラエラー: ' + e.message;
    statusText.style.color = '#ff3333';
  }
});

function getCenterColor() {
  ctx.drawImage(video, 0, 0, 64, 64);
  const data = ctx.getImageData(20, 20, 24, 24).data;
  let r = 0, g = 0, b = 0, count = 0;
  for (let i = 0; i < data.length; i += 4) {
    r += data[i]; g += data[i+1]; b += data[i+2]; count++;
  }
  return { r: r/count, g: g/count, b: b/count };
}

function loop() {
  if (!baseColor) return;
  const now = getCenterColor();
  // 最初の景色からの変化量（近づくと影や色が大きく変わるのを利用）
  const diff = Math.abs(now.r - baseColor.r) + Math.abs(now.g - baseColor.g) + Math.abs(now.b - baseColor.b);

  if (diff > 180) {
    currentLevel = 3;
    targetBox.style.borderColor = '#ff0000';
    statusText.innerText = '危険！ストップ';
    statusText.style.color = '#ff3333';
  } else if (diff > 110) {
    currentLevel = 2;
    targetBox.style.borderColor = '#ffff00';
    statusText.innerText = '接近中';
    statusText.style.color = '#ffff33';
  } else if (diff > 55) {
    currentLevel = 1;
    targetBox.style.borderColor = '#00ff00';
    statusText.innerText = '障害物検知';
    statusText.style.color = '#33ff33';
  } else {
    currentLevel = 0;
    targetBox.style.borderColor = '#00ff00';
    statusText.innerText = 'クリア';
    statusText.style.color = '#ffffff';
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
