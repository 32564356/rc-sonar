<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RC トヨタ風バックモニター</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
video,canvas{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover}
canvas{pointer-events:none}
#ui{position:fixed;top:35px;left:15px;z-index:9;background:rgba(0,0,0,.7);padding:8px 16px;border-radius:20px}
button{font-size:18px;padding:12px 24px;background:#007bff;color:#fff;border:none;border-radius:8px;font-weight:bold;touch-action:manipulation}
#gear{position:fixed;top:35px;right:15px;z-index:9;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.7);border:2px solid #ffa500;display:none;align-items:center;justify-content:center;font-size:20px;touch-action:manipulation}
#menu{position:fixed;top:90px;right:15px;z-index:9;background:#111;border:1px solid #555;padding:15px;border-radius:12px;width:240px;display:none}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="g"></canvas>
<div id="ui"><button id="b" onclick="startApp()">ソナー起動</button><div id="s" style="display:none;font-weight:bold">クリア</div></div>
<div id="gear" onclick="toggleMenu()">⚙️</div>
<div id="menu">
  <div>ソナー感度</div><input type="range" id="r1" min="10" max="90" value="45" style="width:100%" oninput="th=+this.value">
  <div style="margin-top:8px">曲がり感度</div><input type="range" id="r2" min="1" max="10" value="7" style="width:100%" oninput="gain=+this.value*0.6">
  <button id="invBtn" onclick="toggleLineDir()" style="width:100%;margin-top:12px;padding:12px;font-size:15px;background:#333;border:1px solid #777">↔️ 線の曲がり反転：標準</button>
  <button id="voiceBtn" onclick="toggleVoice()" style="width:100%;margin-top:8px;padding:12px;font-size:15px;background:#007bff;border:1px solid #777">🔊 音声案内：ON</button>
</div>
<canvas id="p" width="64" height="64" style="display:none"></canvas>
<script>
var v=document.getElementById('v'),g=document.getElementById('g'),gx=g.getContext('2d'),p=document.getElementById('p'),px=p.getContext('2d'),b=document.getElementById('b'),s=document.getElementById('s'),gear=document.getElementById('gear'),menu=document.getElementById('menu'),invBtn=document.getElementById('invBtn'),voiceBtn=document.getElementById('voiceBtn');
var ac=null,lv=0,osc=null,st=0,ang=0,lineDir=-1,th=45,gain=4,pL=null,pR=null;
var leftLv=0,rightLv=0,voiceOn=true,lastSpeakTime=0,lastSpeakSide='';

function toggleMenu(){
  menu.style.display=(menu.style.display==='block')?'none':'block';
}

function toggleLineDir(){
  lineDir = lineDir * -1;
  ang = -ang;
  invBtn.innerText = (lineDir === -1) ? '↔️ 線の曲がり反転：標準' : '↔️ 線の曲がり反転：反転中';
  invBtn.style.background = (lineDir === -1) ? '#333' : '#d97706';
}

function toggleVoice(){
  voiceOn = !voiceOn;
  voiceBtn.innerText = voiceOn ? '🔊 音声案内：ON' : '🔇 音声案内：OFF';
  voiceBtn.style.background = voiceOn ? '#007bff' : '#333';
}

// 日本語音声アナウンス関数
function speakWarning(text, side){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  var now = Date.now();
  // 同じ方向は4.5秒間隔をあけて連呼を防止
  if(side === lastSpeakSide && (now - lastSpeakTime) < 4500) return;
  if((now - lastSpeakTime) < 2200) return;

  try{
    window.speechSynthesis.cancel();
    var uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'ja-JP';
    uttr.rate = 1.15;
    uttr.pitch = 1.05;
    window.speechSynthesis.speak(uttr);
    lastSpeakTime = now;
    lastSpeakSide = side;
  }catch(e){}
}

// トヨタ風「ポッ、ポッ、ポッ」という丸みのある優しい電子音（サイン波＋柔らかアタック）
function beep(d){
  if(!ac)return;
  try{
    var o=ac.createOscillator(),gn=ac.createGain();
    o.type='sine'; // 丸みのある「ポッ」という音色
    o.frequency.setValueAtTime(1650, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(1580, ac.currentTime + d); // わずかにピッチが下がると「ポッ」と聞こえる

    gn.gain.setValueAtTime(0.001, ac.currentTime);
    gn.gain.linearRampToValueAtTime(0.45, ac.currentTime + 0.012); // 角を丸める立ち上がり
    gn.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);

    o.connect(gn);gn.connect(ac.destination);
    o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}

setInterval(function(){
  st++;
  if(lv===3){
    if(!osc&&ac){
      try{
        osc=ac.createOscillator();var gn=ac.createGain();
        osc.type='sine';osc.frequency.value=1620;gn.gain.value=0.4;
        osc.connect(gn);gn.connect(ac.destination);osc.start();
      }catch(e){}
    }
  }else{
    if(osc){try{osc.stop();}catch(e){}osc=null;}
    if(lv===2&&st%2===0)beep(0.09);
    else if(lv===1&&st%6===0)beep(0.10);
  }
},90);

function startApp(){
  b.style.display='none';
  s.style.display='block';
  gear.style.display='flex';
  s.innerText='起動中...';

  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    ac=new AC();
    if(ac.state==='suspended')ac.resume();
  }catch(e){}

  // iPhoneの音声読み上げを最初のタップで有効化
  try{
    if('speechSynthesis' in window){
      var dummy = new SpeechSynthesisUtterance('');
      window.speechSynthesis.speak(dummy);
    }
  }catch(e){}

  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
    .then(function(stream){
      v.srcObject=stream;
      v.play();
      setTimeout(function(){
        g.width=window.innerWidth;
        g.height=window.innerHeight;
        s.innerText='クリア';
        loop();
      },600);
    })
    .catch(function(err){
      s.innerText='カメラ許可エラー';
    });
  }else{
    s.innerText='カメラ非対応';
  }
}

// 画面の指定エリア（左半分・右半分）の接近スコアを個別計算
function calcAreaScore(d, xStart, xEnd){
  var ed=0, br=0, c=0;
  for(var y=16; y<48; y++){
    for(var x=xStart; x<xEnd; x++){
      var i=(y*64+x)*4;
      br += (d[i]+d[i+1]+d[i+2])/3;
      ed += Math.abs(d[i]-d[i+4]) + Math.abs(d[i+1]-d[i+5]) + Math.abs(d[i+2]-d[i+6]);
      c++;
    }
  }
  return Math.max(0, 50-(ed/c)*1.8) + Math.max(0, (120-(br/c))*0.4);
}

// 画面の角（左下・右下）にWi-Fi風のソナー波紋曲線を描画
function drawCornerSonar(ctx, cornerX, cornerY, isLeft, level){
  if(level <= 0) return;
  // 点滅演出（レベルが高いほど速く点滅）
  var blinkSpeed = (level === 3) ? 100 : (level === 2 ? 200 : 400);
  var isBright = Math.floor(Date.now() / blinkSpeed) % 2 === 0;

  var color = '#00ff66'; // レベル1：緑
  if(level === 2) color = '#ffdd00'; // レベル2：黄
  if(level === 3) color = '#ff3333'; // レベル3：赤

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.globalAlpha = isBright ? 0.95 : 0.35;

  // 角から内側へ向かう扇形の角度（左下なら右上方向、右下なら左上方向）
  var startAngle = isLeft ? -Math.PI * 0.45 : Math.PI * 1.05;
  var endAngle   = isLeft ? -Math.PI * 0.05 : Math.PI * 1.45;

  // レベルに応じて1本〜3本の曲線を描画（🛜のような波紋マーク）
  var radii =;
  for(var rIdx = 0; rIdx < level; rIdx++){
    ctx.beginPath();
    ctx.arc(cornerX, cornerY, radii[rIdx], startAngle, endAngle);
    ctx.stroke();
  }

  // 角の起点ドット
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cornerX, cornerY, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function loop(){
  var w=g.width=window.innerWidth,h=g.height=window.innerHeight;
  if(v.readyState>=2){
    px.drawImage(v,0,0,64,64);
    var d=px.getImageData(0,0,64,64).data;
    var lS=0,rS=0;

    // 左側エリア（x: 6〜31）と 右側エリア（x: 32〜57）の接近度を別々に計算
    var scoreL = calcAreaScore(d, 6, 31);
    var scoreR = calcAreaScore(d, 32, 57);
    var tr = 100 - th;

    leftLv = (scoreL > tr+22) ? 3 : (scoreL > tr+10 ? 2 : (scoreL > tr ? 1 : 0));
    rightLv = (scoreR > tr+22) ? 3 : (scoreR > tr+10 ? 2 : (scoreR > tr ? 1 : 0));
    lv = Math.max(leftLv, rightLv);

    // 音声アナウンス判定（画面左に障害物＝右後方です、画面右に障害物＝左後方です）
    if(leftLv >= 2 && leftLv > rightLv){
      speakWarning('右後方です', 'left');
    } else if(rightLv >= 2 && rightLv > leftLv){
      speakWarning('左後方です', 'right');
    }

    // ガイド線の横移動検知
    for(var y=8;y<56;y+=2){
      for(var x=4;x<30;x+=2){var i=(y*64+x)*4;lS+=d[i]+d[i+1]+d[i+2];}
      for(var x=34;x<60;x+=2){var i=(y*64+x)*4;rS+=d[i]+d[i+1]+d[i+2];}
    }
    if(pL!==null){
      ang=Math.max(-1.5,Math.min(1.5,ang*0.85+((rS-pR)-(lS-pL))/12000*gain*lineDir));
    }
    pL=lS;pR=rS;

    if(lv===3){s.innerText='危険！ストップ';s.style.color='#f33';}
    else if(lv===2){s.innerText='接近中';s.style.color='#ff3';}
    else if(lv===1){s.innerText='障害物検知';s.style.color='#3f3';}
    else{s.innerText='クリア';s.style.color='#fff';}
  }

  gx.clearRect(0,0,w,h);
  var off=ang*w*0.7,bL=w*0.15,bR=w*0.85,tL=w*0.32,tR=w*0.68,tY=h*0.45,bY=h*0.88;
  gx.lineWidth=4;
  gx.strokeStyle='rgba(255,50,50,.85)';gx.beginPath();gx.moveTo(bL,bY);gx.lineTo(bL+(tL-bL)*0.25,bY-(bY-tY)*0.25);gx.lineTo(bR-(bR-tR)*0.25,bY-(bY-tY)*0.25);gx.lineTo(bR,bY);gx.stroke();
  gx.strokeStyle='rgba(255,220,0,.85)';gx.beginPath();gx.moveTo(bL+(tL-bL)*0.25,bY-(bY-tY)*0.25);gx.lineTo(bL+(tL-bL)*0.6,bY-(bY-tY)*0.6);gx.lineTo(bR-(bR-tR)*0.6,bY-(bY-tY)*0.6);gx.lineTo(bR-(bR-tR)*0.25,bY-(bY-tY)*0.25);gx.stroke();
  gx.strokeStyle='rgba(0,255,100,.85)';gx.beginPath();gx.moveTo(bL+(tL-bL)*0.6,bY-(bY-tY)*0.6);gx.lineTo(tL,tY);gx.lineTo(tR,tY);gx.lineTo(bR-(bR-tR)*0.6,bY-(bY-tY)*0.6);gx.stroke();
  gx.strokeStyle='rgba(255,165,0,.95)';gx.lineWidth=6;
  gx.beginPath();gx.moveTo(bL+15,bY);gx.quadraticCurveTo((bL+tL)/2,(bY+tY)/2,tL+off,tY);gx.stroke();
  gx.beginPath();gx.moveTo(bR-15,bY);gx.quadraticCurveTo((bR+tR)/2,(bY+tY)/2,tR+off,tY);gx.stroke();

  // 左下・右下の角にソナー曲線マークを描画
  drawCornerSonar(gx, 25, h - 25, true, leftLv);
  drawCornerSonar(gx, w - 25, h - 25, false, rightLv);

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
