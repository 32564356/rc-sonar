<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RC トヨタ風ソナー＆連動ガイド</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
  #container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; }
  
  video { width: 100%; height: 100%; object-fit: cover; }
  #guide-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  
  #ui { position: absolute; top: 15px; left: 15px; z-index: 15; background: rgba(0,0,0,0.65); padding: 8px 16px; border-radius: 20px; }
  #startBtn { font-size: 18px; padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; }
  #status { font-size: 16px; font-weight: bold; color: #0f0; }

  #gearBtn {
    position: absolute; top: 15px; right: 15px; z-index: 20;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,0.7); border: 2px solid #888;
    color: #fff; font-size: 20px; display: none;
    justify-content: center; align-items: center;
  }

  #menuPanel {
    position: absolute; top: 70px; right: 15px; z-index: 25;
    background: rgba(15,15,15,0.92); border: 1px solid #555;
    padding: 15px; border-radius: 12px; width: 240px;
    display: none; text-align: left;
  }
  .subBtn { width: 100%; padding: 10px; margin-top: 8px; background: #333; color: #fff; border: 1px solid #666; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>

<div id="container">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="guide-canvas"></canvas>
  
  <div id="ui">
    <button id="startBtn">ソナー起動</button>
    <div id="status" style="display:none;">準備中...</div>
  </div>

  <div id="gearBtn">⚙️</div>

  <div id="menuPanel">
    <div style="font-size:13px; color:#ccc;">反応距離（右で遠くから反応）</div>
    <input type="range" id="sensSlider" min="10" max="90" value="45" style="width:100%; margin:8px 0;">
    <button class="subBtn" id="invertBtn">↔️ ガイド左右反転</button>
    <button class="subBtn" id="fitBtn">🖥️ 画面フィット切替</button>
  </div>
</div>

<canvas id="canvas" width="64" height="64" style="display:none;"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const guideCanvas = document.getElementById('guide-canvas');
const gCtx = guideCanvas.getContext('2d');

const statusText = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const gearBtn = document.getElementById('gearBtn');
const menuPanel = document.getElementById('menuPanel');
const sensSlider = document.getElementById('sensSlider');
const invertBtn = document.getElementById('invertBtn');
const fitBtn = document.getElementById('fitBtn');

let audioCtx;
let currentLevel = 0;
let continuousOsc = null;
let step = 0;
let turnAngle = 0;
let invertDir = 1;
let proximityThreshold = 45;
let isCover = true;

let prevRow = null;
let gyroWorking = false;

const TOYOTA_FREQ = 2500;

function resizeCanvas() {
  guideCanvas.width = window.innerWidth;
  guideCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);

gearBtn.onclick = function() {
  menuPanel.style.display = (menuPanel.style.display === 'block') ? 'none' : 'block';
};

sensSlider.oninput = function() {
  proximityThreshold = parseInt(sensSlider.value);
};

invertBtn.onclick = function() {
  invertDir *= -1;
};

fitBtn.onclick = function() {
  isCover = !isCover;
  video.style.objectFit = isCover ? 'cover' : 'contain';
};

function playToyotaBeep(duration) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = TOYOTA_FREQ;
  gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 0.008);
  gain.gain.setValueAtTime(0.35, audioCtx.currentTime + duration - 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function setContinuousBeep(active) {
  if (!audioCtx) return;
  if (active && !continuousOsc) {
    continuousOsc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    continuousOsc.type = 'triangle';
    continuousOsc.frequency.value = TOYOTA_FREQ;
    gain.gain.value = 0.35;
    continuousOsc.connect(gain);
    gain.connect(audioCtx.destination);
    continuousOsc.start();
  } else if (!active && continuousOsc) {
    continuousOsc.stop();
    continuousOsc.disconnect();
    continuousOsc = null;
  }
}

setInterval(function() {
  step++;
  if (currentLevel === 3) {
    setContinuousBeep(true);
  } else {
    setContinuousBeep(false);
    if (currentLevel === 2 && step % 2 === 0) playToyotaBeep(0.06);
    else if (currentLevel === 1 && step % 6 === 0) playToyotaBeep(0.07);
  }
}, 85);

startBtn.onclick = async function() {
  try {
    // 1. タップした瞬間に最優先でジャイロ許可を取得（GitHub環境で確実に許可を出すため）
    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        const res = await DeviceMotionEvent.requestPermission();
        if (res === 'granted') {
          window.addEventListener('devicemotion', onMotion);
        }
      } catch (err) {}
    } else if (window.DeviceMotionEvent) {
      window.addEventListener('devicemotion', onMotion);
    }

    startBtn.style.display = 'none';
    statusText.style.display = 'block';
    gearBtn.style.display = 'flex';
    statusText.innerText = '起動中...';

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    video.srcObject = stream;

    setTimeout(function() {
      resizeCanvas();
      statusText.innerText = 'クリア';
      loop();
    }, 800);
  } catch (e) {
    statusText.innerText = 'エラー: ' + e.message;
  }
};

function onMotion(e) {
  if (!e.rotationRate) return;
  const rZ = e.rotationRate.alpha || 0;
  const rY = e.rotationRate.beta || 0;
  const rX = e.rotationRate.gamma || 0;
  // 縦置き・横置き・平置きどの向きでも一番大きく回った軸を検知
  let spd = rZ;
  if (Math.abs(rY) > Math.abs(spd)) spd = rY;
  if (Math.abs(rX) > Math.abs(spd)) spd = rX;

  if (Math.abs(spd) > 0.05) {
    gyroWorking = true;
    // 感度を3倍にアップし、余韻を残しながら滑らかに戻す
    turnAngle = turnAngle * 0.90 + (spd * 0.045 * invertDir);
    if (turnAngle > 1.2) turnAngle = 1.2;
    if (turnAngle < -1.2) turnAngle = -1.2;
  }
}

function analyzeFrame() {
  ctx.drawImage(video, 0, 0, 64, 64);
  const fullData = ctx.getImageData(0, 0, 64, 64).data;
  
  let edgeSum = 0;
  let brightnessSum = 0;
  let count = 0;

  for (let y = 16; y < 47; y++) {
    for (let x = 16; x < 47; x++) {
      const idx = (y * 64 + x) * 4;
      const idxRight = (y * 64 + (x + 1)) * 4;
      
      const bright = (fullData[idx] + fullData[idx+1] + fullData[idx+2]) / 3;
      brightnessSum += bright;

      const edge = Math.abs(fullData[idx] - fullData[idxRight]) + 
                   Math.abs(fullData[idx+1] - fullData[idxRight+1]) + 
                   Math.abs(fullData[idx+2] - fullData[idxRight+2]);
      edgeSum += edge;
      count++;
    }
  }

  const avgEdge = edgeSum / count;
  const avgBright = brightnessSum / count;
  const proximityScore = Math.max(0, 50 - avgEdge * 1.8) + Math.max(0, (120 - avgBright) * 0.4);

  // ジャイロが許可されなかった場合でもカメラの横流れで斜め線を動かす
  if (!gyroWorking) {
    let currentRow = new Float32Array(64);
    for (let x = 0; x < 64; x++) {
      let sum = 0;
      for (let y = 24; y < 40; y++) {
        const idx = (y * 64 + x) * 4;
        sum += (fullData[idx] + fullData[idx+1] + fullData[idx+2]) / 3;
      }
      currentRow[x] = sum / 16;
    }

    if (prevRow) {
      let bestShift = 0;
      let minDiff = 999999;
      for (let shift = -6; shift <= 6; shift++) {
        let diff = 0;
        for (let x = 8; x < 56; x++) {
          diff += Math.abs(currentRow[x] - prevRow[x + shift]);
        }
        if (diff < minDiff) {
          minDiff = diff;
          bestShift = shift;
        }
      }
      turnAngle = turnAngle * 0.88 + (bestShift * 0.18 * invertDir);
      if (turnAngle > 1.2) turnAngle = 1.2;
      if (turnAngle < -1.2) turnAngle = -1.2;
    }
    prevRow = currentRow;
  }

  return proximityScore;
}

function drawGuides() {
  const w = guideCanvas.width;
  const h = guideCanvas.height;
  gCtx.clearRect(0, 0, w, h);

  const offset = turnAngle * (w * 0.55);
  const bL = w * 0.15, bR = w * 0.85;
  const tL = w * 0.32, tR = w * 0.68;
  const tY = h * 0.45, bY = h * 0.88;

  gCtx.lineWidth = 4;

  // 赤
  gCtx.strokeStyle = 'rgba(255, 50, 50, 0.85)';
  gCtx.beginPath();
  gCtx.moveTo(bL, bY);
  gCtx.lineTo(bL + (tL - bL)*0.25, bY - (bY - tY)*0.25);
  gCtx.lineTo(bR - (bR - tR)*0.25, bY - (bY - tY)*0.25);
  gCtx.lineTo(bR, bY);
  gCtx.stroke();

  // 黄
  gCtx.strokeStyle = 'rgba(255, 220, 0, 0.85)';
  gCtx.beginPath();
  gCtx.moveTo(bL + (tL - bL)*0.25, bY - (bY - tY)*0.25);
  gCtx.lineTo(bL + (tL - bL)*0.6, bY - (bY - tY)*0.6);
  gCtx.lineTo(bR - (bR - tR)*0.6, bY - (bY - tY)*0.6);
  gCtx.lineTo(bR - (bR - tR)*0.25, bY - (bY - tY)*0.25);
  gCtx.stroke();

  // 緑
  gCtx.strokeStyle = 'rgba(0, 255, 100, 0.85)';
  gCtx.beginPath();
  gCtx.moveTo(bL + (tL - bL)*0.6, bY - (bY - tY)*0.6);
  gCtx.lineTo(tL, tY);
  gCtx.lineTo(tR, tY);
  gCtx.lineTo(bR - (bR - tR)*0.6, bY - (bY - tY)*0.6);
  gCtx.stroke();

  // オレンジ予想進路線
