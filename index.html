<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
video,canvas{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover}
canvas{pointer-events:none}
#ui{position:fixed;top:15px;left:15px;z-index:9;background:rgba(0,0,0,.7);padding:8px 16px;border-radius:20px}
button{font-size:18px;padding:10px 20px;background:#007bff;color:#fff;border:none;border-radius:8px;font-weight:bold}
#gear{position:fixed;top:15px;right:15px;z-index:9;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.7);border:2px solid #ffa500;display:none;align-items:center;justify-content:center;font-size:20px}
#menu{position:fixed;top:70px;right:15px;z-index:9;background:#111;border:1px solid #555;padding:15px;border-radius:12px;width:230px;display:none}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="g"></canvas>
<div id="ui"><button id="b">ソナー起動</button><div id="s" style="display:none;font-weight:bold">クリア</div></div>
<div id="gear">⚙️</div>
<div id="menu">
  <div>ソナー感度</div><input type="range" id="r1" min="10" max="90" value="45" style="width:100%">
  <div style="margin-top:8px">曲がり感度</div><input type="range" id="r2" min="1" max="10" value="7" style="width:100%">
  <button id="inv" style="width:100%;margin-top:10px;font-size:14px;background:#333">↔️ 左右反転</button>
</div>
<canvas id="p" width="64" height="64" style="display:none"></canvas>
<script>
const v=document.getElementById('v'),g=document.getElementById('g'),gx=g.getContext('2d'),p=document.getElementById('p'),px=p.getContext('2d',{willReadFrequently:true}),b=document.getElementById('b'),s=document.getElementById('s'),gear=document.getElementById('gear'),menu=document.getElementById('menu');
let ac,lv=0,osc=null,st=0,ang=0,inv=-1,th=45,gain=4,pL=null,pR=null;
gear.onclick=()=>menu.style.display=menu.style.display=='block'?'none':'block';
document.getElementById('r1').oninput=e=>th=+e.target.value;
document.getElementById('r2').oninput=e=>gain=+e.target.value*0.6;
document.getElementById('inv').onclick=()=>inv*=-1;
function beep(d){if(!ac)return;const o=ac.createOscillator(),gn=ac.createGain();o.type='triangle';o.frequency.value=2500;gn.gain.setValueAtTime(.35,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}
setInterval(()=>{st++;if(lv==3){if(!osc){osc=ac.createOscillator();const gn=ac.createGain();osc.type='triangle';osc.frequency.value=2500;gn.gain.value=.35;osc.connect(gn);gn.connect(ac.destination);osc.start();}}else{if(osc){osc.stop();osc=null;}if(lv==2&&st%2==0)beep(.06);else if(lv==1&&st%6==0)beep(.07);}},85);
b.onclick=async()=>{
  b.style.display='none';s.style.display='block';gear.style.display='flex';
  ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')await ac.resume();
  v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  setTimeout(()=>{g.width=innerWidth;g.height=innerHeight;loop();},800);
};
function loop(){
  const w=g.width=innerWidth,h=g.height=innerHeight;
  if(v.readyState>=2){
    px.drawImage(v,0,0,64,64);const d=px.getImageData(0,0,64,64).data;
    let ed=0,br=0,c=0,lS=0,rS=0;
    for(let y=16;y<47;y++)for(let x=16;x<47;x++){const i=(y*64+x)*4;br+=(d[i]+d[i+1]+d[i+2])/3;ed+=Math.abs(d[i]-d[i+4])+Math.abs(d[i+1]-d[i+5])+Math.abs(d[i+2]-d[i+6]);c++;}
    for(let y=8;y<56;y+=2){for(let x=4;x<30;x+=2){const i=(y*64+x)*4;lS+=d[i]+d[i+1]+d[i+2];}for(let x=34;x<60;x+=2){const i=(y*64+x)*4;rS+=d[i]+d[i+1]+d[i+2];}}
    if(pL!==null){ang=Math.max(-1.5,Math.min(1.5,ang*.85+((rS-pR)-(lS-pL))/12000*gain*inv));}
    pL=lS;pR=rS;
    const sc=Math.max(0,50-(ed/c)*1.8)+Math.max(0,(120-(br/c))*.4),tr=100-th;
    if(sc>tr+22){lv=3;s.innerText='危険！ストップ';s.style.color='#f33';}
    else if(sc>tr+10){lv=2;s.innerText='接近中';s.style.color='#ff3';}
    else if(sc>tr){lv=1;s.innerText='障害物検知';s.style.color='#3f3';}
    else{lv=0;s.innerText='クリア';s.style.color='#fff';}
  }
  gx.clearRect(0,0,w,h);
  const off=ang*w*.7,bL=w*.15,bR=w*.85,tL=w*.32,tR=w*.68,tY=h*.45,bY=h*.88;
  gx.lineWidth=4;
  gx.strokeStyle='rgba(255,50,50,.85)';gx.beginPath();gx.moveTo(bL,bY);gx.lineTo(bL+(tL-bL)*.25,bY-(bY-tY)*.25);gx.lineTo(bR-(bR-tR)*.25,bY-(bY-tY)*.25);gx.lineTo(bR,bY);gx.stroke();
  gx.strokeStyle='rgba(255,220,0,.85)';gx.beginPath();gx.moveTo(bL+(tL-bL)*.25,bY-(bY-tY)*.25);gx.lineTo(bL+(tL-bL)*.6,bY-(bY-tY)*.6);gx.lineTo(bR-(bR-tR)*.6,bY-(bY-tY)*.6);gx.lineTo(bR-(bR-tR)*.25,bY-(bY-tY)*.25);gx.stroke();
  gx.strokeStyle='rgba(0,255,100,.85)';gx.beginPath();gx.moveTo(bL+(tL-bL)*.6,bY-(bY-tY)*.6);gx.lineTo(tL,tY);gx.lineTo(tR,tY);gx.lineTo(bR-(bR-tR)*.6,bY-(bY-tY)*.6);gx.stroke();
  gx.strokeStyle='rgba(255,165,0,.95)';gx.lineWidth=6;
  gx.beginPath();gx.moveTo(bL+15,bY);gx.quadraticCurveTo((bL+tL)/2,(bY+tY)/2,tL+off,tY);gx.stroke();
  gx.beginPath();gx.moveTo(bR-15,bY);gx.quadraticCurveTo((bR+tR)/2,(bY+tY)/2,tR+off,tY);gx.stroke();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
