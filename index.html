<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC パーキングセンサー</title>
<script src="https://jsdelivr.net"></script>
<script src="https://jsdelivr.net"></script>
<style>
  body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
  #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
  video, canvas { position: absolute; max-width: 100%; max-height: 100%; }
  #ui { position: absolute; top: 20px; z-index: 10; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px; }
  button { font-size: 18px; padding: 10px 25px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
  #status { font-size: 20px; font-weight: bold; margin-top: 10px; color: #0f0; }
</style>
</head>
<body>

<div id="container">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <button id="startBtn">ソナー起動</button>
    <div id="status">待機中...</div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusText = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

let model, audioCtx;
let currentLevel = 0; // 0:安全, 1:遠い(緑), 2:近い(黄), 3:危険(赤)
let beepTimer = null;

// 警告音（ピッ）を鳴らす関数
function playBeep(duration = 0.08, freq = 1000) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}

// 距離レベルに応じて音のテンポを変えるループ
function startBeepLoop() {
  if (beepTimer) clearInterval(beepTimer);
  let step = 0;
  beepTimer = setInterval(() => {
    step++;
    if (currentLevel === 3) {
      playBeep(0.15, 1200); // 連続音に近い速さ
    } else if (currentLevel === 2 && step % 2 === 0) {
      playBeep(0.08, 1000); // 速い「ピピピ」
    } else if (currentLevel === 1 && step % 5 === 0) {
      playBeep(0.08, 900);  // ゆっくり「ピッ」
    }
  }, 150);
}

// カメラとAIの起動
startBtn.addEventListener('click', async () => {
  startBtn.style.display = 'none';
  statusText.innerText = 'AIモデル読み込み中...';
  
  // スマホのブラウザで音を鳴らすための初期化
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  // 背面カメラを起動
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment' }, audio: false
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  model = await cocoSsd.load();
  statusText.innerText = 'ソナー稼働中';
  startBeepLoop();
  detectFrame();
});

// 毎フレームの物体検知と距離判定
async function detectFrame() {
  const predictions = await model.detect(video);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  let maxRatio = 0;

  predictions.forEach(pred => {
    const [x, y, width, height] = pred.bbox;
    // 画面の横幅に対して物体がどれくらいの割合を占めているかで距離を推定
    const widthRatio = width / canvas.width;
    if (widthRatio > maxRatio) maxRatio = widthRatio;

    // 枠の色を決定
    let color = '#00ff00';
    if (widthRatio > 0.6) color = '#ff0000';
    else if (widthRatio > 0.35) color = '#ffff00';

    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.strokeRect(x, y, width, height);
    ctx.fillStyle = color;
    ctx.font = '18px sans-serif';
    ctx.fillText(`${pred.class} (${Math.round(widthRatio * 100)}%)`, x, y > 20 ? y - 5 : 20);
  });

  // 警告レベルの更新
  if (maxRatio > 0.6) {
    currentLevel = 3;
    statusText.innerText = '危険！停止してください';
    statusText.style.color = '#ff3333';
  } else if (maxRatio > 0.35) {
    currentLevel = 2;
    statusText.innerText = '接近中';
    statusText.style.color = '#ffff33';
  } else if (maxRatio > 0.15) {
    currentLevel = 1;
    statusText.innerText = '障害物あり';
    statusText.style.color = '#33ff33';
  } else {
    currentLevel = 0;
    statusText.innerText = 'クリア';
    statusText.style.color = '#ffffff';
  }

  requestAnimationFrame(detectFrame);
}
</script>
</body>
</html>
